<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITAL CLOCK</title>
    <link href="style.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <div class="days">
           <div >SUN</div>
           <div>MON</div>
           <div>TUE</div>
           <div>WED</div>
           <div class="active">THUR</div>
           <div>FRI</div>
           <div>SAT</div>
        </div>
        <div class="time">
            <div class="hour">11</div>
            <div class="colon">:</div>
            <div class="min">23</div>
            <div class="dot">:</div>
            <div class="sec">24</div>
        </div>
    </div>
    <script src="clock.js"></script>
</body>
</html>
